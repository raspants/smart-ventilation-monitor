services:
  db:
    image: postgres:16
    container_name: Smart-vent-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_vent}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smart_vent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: smart-vent-api
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-smart_vent}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_VERSION: v1
    ports:
      - "${API_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: