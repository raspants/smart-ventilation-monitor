services:
  db:
    image: postgres:16
    container_name: Smart-vent-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_vent}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smart_vent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    container_name: smart-vent-broker
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: ./api
    container_name: smart-vent-api
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-smart_vent}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_VERSION: v1
      MQTT_HOST: ${MQTT_HOST:-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-smartvent/+/telemetry}
    ports:
      - "${API_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

  dashboard:
    build: ./dashboard
    container_name: smart-vent-dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

volumes:
  postgres_data:
  